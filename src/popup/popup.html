<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synto</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <!-- Top bar: utility icons -->
  <div class="top-bar">
    <div class="top-bar-actions">
      <span id="provider-health" class="provider-health hidden" title="Provider status" aria-label="Provider status"></span>
      <button id="btn-theme" type="button" data-theme-mode="system" title="Theme: system" aria-label="Toggle theme">
        <svg class="theme-icon-system" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="4" width="18" height="13" rx="2"/>
          <path d="M8 21h8"/>
          <path d="M12 17v4"/>
        </svg>
        <svg class="theme-icon-light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2"/>
          <path d="M12 20v2"/>
          <path d="M4.93 4.93l1.41 1.41"/>
          <path d="M17.66 17.66l1.41 1.41"/>
          <path d="M2 12h2"/>
          <path d="M20 12h2"/>
          <path d="M4.93 19.07l1.41-1.41"/>
          <path d="M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="theme-icon-dark" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
      <button id="btn-help" data-i18n-title="options_nav_help" aria-label="Open Help">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
      </button>
      <button id="btn-options" data-i18n-title="options_brand_sub" aria-label="Open Settings">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.09a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button id="btn-pro-mode" type="button" data-pro-state="off" data-i18n-title="popup_pro_mode_off" title="Pro mode: off" aria-label="Toggle Pro mode">
        <svg class="pro-icon-light" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 3v3"/>
          <path d="M12 18v3"/>
          <path d="M3 12h3"/>
          <path d="M18 12h3"/>
          <path d="M5.6 5.6l2.1 2.1"/>
          <path d="M16.3 16.3l2.1 2.1"/>
          <path d="M5.6 18.4l2.1-2.1"/>
          <path d="M16.3 7.7l2.1-2.1"/>
        </svg>
        <svg class="pro-icon-pro" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="4" y1="6" x2="20" y2="6"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="18" x2="20" y2="18"/>
          <circle cx="9" cy="6" r="2" fill="currentColor"/>
          <circle cx="15" cy="12" r="2" fill="currentColor"/>
          <circle cx="8" cy="18" r="2" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Template selector -->
  <div class="template-ui">
    <div id="template-cards" class="template-cards" role="listbox" aria-label="Select template"></div>
    <button id="btn-templates-manage" class="btn-templates-manage" type="button" data-i18n-title="popup_manage_templates" aria-label="Manage templates">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 5v14"/>
        <path d="M5 12h14"/>
      </svg>
    </button>
  </div>

  <!-- Error message -->
  <div id="error-msg" class="status-msg error hidden" role="alert"></div>

  <!-- Preview panel -->
  <div id="preview-panel" class="preview-panel hidden">
    <div class="preview-header">

      <!-- Tabs + info + refresh + token badge -->
      <div class="preview-tab-row">
        <div class="preview-tabs" role="tablist" aria-label="Preview mode">
          <button class="preview-tab active" data-tab="content" role="tab" aria-selected="true" type="button" data-i18n="popup_content_tab">Content</button>
          <button id="tab-prompt" class="preview-tab" data-tab="prompt" role="tab" aria-selected="false" type="button">
            <span data-i18n="popup_prompt_tab">Prompt</span>
            <span id="prompt-edited-badge" class="prompt-edited-badge hidden" data-i18n="popup_prompt_edited">Edited</span>
          </button>
        </div>
        <div class="preview-row-end">
          <div class="refresh-group">
            <button id="btn-content-info" class="preview-info-btn" type="button" aria-label="Content help">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="10"/>
                <path d="M12 16v-4"/>
                <path d="M12 8h.01"/>
              </svg>
            </button>
            <button id="btn-refresh-content" class="preview-refresh-cta" type="button" data-i18n-title="popup_refresh_content" aria-label="Refresh content">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
                <path d="M3 3v5h5"/>
                <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
                <path d="M16 21h5v-5"/>
              </svg>
            </button>
            <button id="btn-scroll-rescan" class="preview-refresh-cta" type="button" data-i18n-title="popup_scroll_rescan" aria-label="Scroll and rescan">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                <path d="M7 12h10"/>
              </svg>
              <span id="scroll-label-full" data-i18n="popup_scroll_rescan">Scroll &amp; Rescan</span>
              <span id="scroll-label-short" class="hidden" data-i18n="popup_scroll_rescan_short">Rescan</span>
            </button>
          </div>
          <span id="token-count" class="token-count" title="Estimated token count">—</span>
        </div>
        <div id="content-info-popover" class="info-popover hidden" role="tooltip"></div>
      </div>

      <div id="token-warning" class="token-warning hidden" data-i18n="popup_near_limit">Near limit</div>

    </div>

    <div class="preview-wrap">
      <textarea id="preview-text" readonly aria-label="Content preview"></textarea>
      <button id="btn-preview-copy" class="preview-copy-hover" type="button" title="Copy" aria-label="Copy preview text">
        <svg class="icon-copy" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        <svg class="icon-check" width="13" height="13" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </button>
    </div>
  </div>

  <div id="content-toast" class="content-toast" role="status" aria-live="polite"></div>

  <!-- Ask AI -->
  <div class="btn-generate-row">
    <button id="btn-process" class="btn-generate" disabled>Ask AI</button>
    <button id="btn-chat-stop" class="btn-stop hidden" type="button" aria-label="Stop generating" title="Stop">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" stroke="none" aria-hidden="true">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>
    </button>
  </div>

  <!-- AI response panel (revealed on first use) -->
  <div id="chat-panel" class="chat-panel hidden">
    <div id="chat-history-banner" class="chat-history-banner hidden">
      <span id="chat-history-label" data-i18n="popup_history_restore"></span>
      <div class="chat-history-actions">
        <button id="btn-history-restore" class="btn-ghost btn-sm" type="button" data-i18n="popup_history_yes">Restore</button>
        <button id="btn-history-dismiss" class="btn-ghost btn-sm" type="button" data-i18n="popup_history_dismiss">Dismiss</button>
      </div>
    </div>
    <div id="chat-no-key" class="status-msg hidden"><span data-i18n="popup_no_key_prefix">No API key set. Add it in&#160;</span><a id="chat-options-link" href="#" data-i18n="popup_options_link">Options</a><span data-i18n="popup_no_key_suffix">.</span></div>
    <div id="chat-messages" class="chat-messages" role="log" aria-live="polite"></div>
    <div id="chat-export-row" class="chat-export-row hidden">
      <button id="btn-export-chat" class="btn-ghost btn-sm" type="button" data-i18n="popup_export_chat">Export .md</button>
    </div>
    <div id="chat-input-row" class="chat-input-row hidden">
      <textarea id="chat-input" class="chat-input" data-i18n-placeholder="popup_chat_placeholder" placeholder="Ask a follow-up…" rows="1" aria-label="Follow-up message"></textarea>
      <button id="btn-chat-send" class="btn-chat-send" type="button" aria-label="Send message">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="22" y1="2" x2="11" y2="13"/>
          <polygon points="22 2 15 22 11 13 2 9 22 2"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Status footer — anchored bottom -->
  <footer class="popup-footer" aria-label="Status">
    <span class="footer-cluster">
      <span id="footer-provider" class="footer-provider"></span>
      <span class="footer-sep" aria-hidden="true">·</span>
      <span id="footer-model" class="footer-model"></span>
    </span>
    <span id="footer-version" class="footer-version"></span>
  </footer>

  <script type="module" src="popup.js"></script>
</body>
</html>
